name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Installer tests
        run: |
          sh -n scripts/install.sh
          scripts/test-install.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Wails native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Wails app
        run: $(go env GOPATH)/bin/wails build -tags webkit2_41

      - name: Vet
        run: go vet -tags webkit2_41 ./...

      - name: Check formatting
        run: |
          gofmt -l . | tee /tmp/gofmt-out
          [ ! -s /tmp/gofmt-out ]

      - name: Test
        run: go test -race -tags webkit2_41 ./...

      - name: Fuzz seed corpus
        run: go test -tags webkit2_41 -run=Fuzz ./internal/provider/... ./internal/catalog/... ./internal/engine/message/...

      - name: Install lint tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.26.1
          go install github.com/gordonklaus/ineffassign@v0.2.0

      - name: gosec
        # G204/G304/G306/G302/G301 describe patterns inherent to a
        # file-IO + command-runner tool; see Makefile GOSEC_EXCLUDE.
        run: GOFLAGS=-tags=webkit2_41 $(go env GOPATH)/bin/gosec -quiet -exclude=G204,G301,G302,G304,G306 ./...

      - name: ineffassign
        run: GOFLAGS=-tags=webkit2_41 $(go env GOPATH)/bin/ineffassign ./...

      - name: Frontend tests
        run: cd frontend && npm run test

  integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Integration tests
        # Integration-tagged tests are selected by name: every such test
        # under ./internal/ must be named TestIntegration*, because
        # -run TestIntegration is the only thing that picks them up.
        run: go test -race -tags integration -run TestIntegration ./internal/...
