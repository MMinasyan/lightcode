name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Wails app
        run: $(go env GOPATH)/bin/wails build

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          gofmt -l . | tee /tmp/gofmt-out
          [ ! -s /tmp/gofmt-out ]

      - name: Test
        run: go test -race ./...

      - name: Fuzz seed corpus
        run: go test -run=Fuzz ./internal/provider/... ./internal/catalog/... ./internal/message/...

      - name: Frontend tests
        run: cd frontend && npm run test
